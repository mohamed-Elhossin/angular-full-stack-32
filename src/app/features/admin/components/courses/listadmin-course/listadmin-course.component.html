<div class="container col-md-7">
  <div class="card">
    <h6>
      List Courses
      <a class="btn btn-link float-end" routerLink="/admins/cc">Create New</a>
    </h6>
    <div class="card-body">
      <table class="table">
        <tr>
          <th>id</th>
          <th>course_name</th>
          <th>price</th>
          <th colspan="3">Action</th>
        </tr>
        @for (item of allData; track $index) {
        <tr>
          <th>{{ $index + 1 }}</th>
          <th>{{ item.course_name }}</th>
          <th>{{ item.price }}</th>
          <th><button (click)="remove(item.id)" class="btn btn-danger">Delete</button></th>
          <th><a routerLink="/admins/uc/{{item.id}}" class="btn btn-warning">Edit</a></th>
          <th><button class="btn btn-info">View</button></th>
        </tr>
        }
      </table>
    </div>
  </div>
</div>
